<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
</head>
<body>

<div class="container" style="margin-top: 50px; max-wigth: 400px;">
    <h3 class="text-center">Login</h3>
    <form th:action="@{/app/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   required/>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   required/>
        </div>

        <br/>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>

        <div th:if="${param.error}" class="alert alert-danger" style="margin-top: 15px;">Invalid username and
            password.
        </div>
        <div th:if="${param.logout}" class="alert-success" style="margin-top: 15px;">You have been logged out.</div>


    </form>
</div>

</body>
</html>
